services:
  beggareventbus:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scoreboard.api:
    image: beggar-scoreboard-api
    build:
      context: ./src
      dockerfile: CardGames.BeggarMyNeighbour.Scoreboard.API/Dockerfile
    depends_on:
      beggareventbus:
        condition: service_healthy
    environment:
      - ConnectionStrings__ScoreBoardDatabase=Data Source=/data/scoreboard.db
      - RabbitMq__HostName=beggareventbus
      # Set SkipVerification=true to accept scores without replaying them through Beggar.Verify:
      # - SkipVerification=true
      # Set UpstreamScoreboard__Url to forward qualifying scores to a parent scoreboard:
      # - UpstreamScoreboard__Url=https://parent-scoreboard.example.com/api/scores
    volumes:
      - beggar-data:/data
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scoreboard.web:
    image: beggar-scoreboard-web
    build:
      context: ./src
      dockerfile: CardGames.BeggarMyNeighbour.Scoreboard.Web/Dockerfile
    depends_on:
      scoreboard.api:
        condition: service_healthy
    environment:
      - ScoreboardApi__BaseUrl=http://scoreboard.api:8080
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  beggarverify:
    image: beggar-verify
    build:
      context: ./src
      dockerfile: CardGames.BeggarMyNeighbour.Verify/Dockerfile
    depends_on:
      beggareventbus:
        condition: service_healthy
    environment:
      - RabbitMqHostName=beggareventbus

  x-compute-base: &compute-base
    image: beggar-compute
    build:
      context: ./src
      dockerfile: CardGames.BeggarMyNeighbour.Compute/Dockerfile
    depends_on:
      scoreboard.api:
        condition: service_healthy
    environment:
      - ScoreboardUrl=http://scoreboard.api:8080/api/scores
      - BeggarUser=anon

  beggarcompute-bruteforce:
    <<: *compute-base
    environment:
      - ScoreboardUrl=http://scoreboard.api:8080/api/scores
      - BeggarUser=anon
      - BeggarTeam=local
      - Algorithm=BruteForce

  beggarcompute-hillclimb:
    <<: *compute-base
    environment:
      - ScoreboardUrl=http://scoreboard.api:8080/api/scores
      - BeggarUser=anon
      - Algorithm=HillClimb

  beggarcompute-annealing:
    <<: *compute-base
    environment:
      - ScoreboardUrl=http://scoreboard.api:8080/api/scores
      - BeggarUser=anon
      - Algorithm=SimulatedAnnealing

  beggarcompute-genetic:
    <<: *compute-base
    environment:
      - ScoreboardUrl=http://scoreboard.api:8080/api/scores
      - BeggarUser=anon
      - Algorithm=Genetic

volumes:
  beggar-data:
